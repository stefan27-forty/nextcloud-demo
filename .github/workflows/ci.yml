name: Nextcloud Deploy
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ASUS_IP }}
          username: ${{ secrets.ASUS_USER }}
          password: ${{ secrets.ASUS_PASSWORD }}
          script: |
            mkdir -p /opt/nextcloud
            cd /opt/nextcloud

            export COMPOSE_HTTP_TIMEOUT=300
            which docker-compose || apt install docker-compose -y

            cat > docker-compose.yml << 'EOF'
            services:
              nextcloud:
                image: nextcloud:latest
                ports:
                  - "8081:80"
                environment:
                  POSTGRES_HOST: db
                  POSTGRES_DB: nextcloud
                  POSTGRES_USER: nextcloud
                  POSTGRES_PASSWORD: nextcloud
                  REDIS_HOST: redis
                volumes:
                  - nextcloud_data:/var/www/html
                depends_on:
                  - db
                  - redis

              db:
                image: postgres:15
                environment:
                  POSTGRES_DB: nextcloud
                  POSTGRES_USER: nextcloud
                  POSTGRES_PASSWORD: nextcloud
                volumes:
                  - db_data:/var/lib/postgresql/data

              redis:
                image: redis:alpine
                volumes:
                  - redis_data:/data
            volumes:
              nextcloud_data:
              db_data: 
              redis_data: 
            EOF 

            docker-compose down || true
            docker-compose up -d 

      - name: Send notification to Telegram
        uses: appleboy/telegram-action@master
        if: always()
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            *Nextcloud Deploy* #${{ github.run_number }}
            *Статус* ${{ job.status }}
            *Автор* ${{ github.actor }}
            *Ссылка* https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}




